<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Secure Chat</title>
    <style>
        /* Немного простых стилей, чтобы чат выглядел аккуратно */
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; list-style-type: none; }
        #messages li { padding: 5px; margin-bottom: 5px; background: #f3f3f3; border-radius: 4px; }
        #form { display: flex; }
        #input { flex-grow: 1; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Наш защищенный чат</h1>

    <!-- Окно со списком сообщений -->
    <ul id="messages"></ul>

    <!-- Форма отправки сообщений -->
    <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Введите сообщение..." /><button>Отправить</button>
    </form>

    <!-- Подключаем Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        // 1. СЛУШАЕМ ОТПРАВКУ ФОРМЫ
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Запрещаем странице перезагружаться при отправке
            if (input.value) {
                // Отправляем событие 'chat message' на сервер и передаем сам текст
                socket.emit('chat message', input.value);
                input.value = ''; // Очищаем поле ввода
            }
        });

        // 2. СЛУШАЕМ ОТВЕТ ОТ СЕРВЕРА
        // Когда сервер пришлет событие 'chat message', мы добавим его на экран
        socket.on('chat message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight; // Прокручиваем чат вниз
        });
    </script>
</body>
</html>
